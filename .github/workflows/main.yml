name: Download and Archive Wallpapers

on:
  schedule:
    # 下面三条 cron 均为 UTC 时间，对应北京时间如注释所示
    - cron: '12 7 * * *'   # 北京时间 15:12
    - cron: '12 16 * * *'  # 北京时间 00:12（次日）
    - cron: '12 0 * * *'   # 北京时间 08:12
  workflow_dispatch:       # 允许手动触发

jobs:
  download-and-archive:
    runs-on: ubuntu-latest
    # 需要写入仓库的权限才能 push
    permissions:
      contents: write

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout（保持推送凭证）
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # 保持推送凭证

      # -------------------------------------------------
      # 2️⃣ 确保归档目录存在
      # -------------------------------------------------
      - name: Create archive directories
        run: mkdir -p archive/cn archive/en

      # -------------------------------------------------
      # 3️⃣ 下载中文版并生成带日期的副本
      # -------------------------------------------------
      - name: Download Chinese version
        run: |
          curl -s -o bing-wallpaper-cn.md \
            https://raw.githubusercontent.com/niumoo/bing-wallpaper/refs/heads/main/zh-cn/bing-wallpaper.md
          TODAY=$(date +'%Y-%m-%d')
          cp bing-wallpaper-cn.md "archive/cn/bing-wallpaper-cn-$TODAY.md"

      # -------------------------------------------------
      # 4️⃣ 下载英文版并生成带日期的副本
      # -------------------------------------------------
      - name: Download English version
        run: |
          curl -s -o bing-wallpaper-en.md \
            https://raw.githubusercontent.com/niumoo/bing-wallpaper/refs/heads/main/bing-wallpaper.md
          TODAY=$(date +'%Y-%m-%d')
          cp bing-wallpaper-en.md "archive/en/bing-wallpaper-en-$TODAY.md"

      # -------------------------------------------------
      # 5️⃣ 删除超过 30 天的归档（保持原有 -mtime 写法，若想改为 -newermt 请参考之前的说明）
      # -------------------------------------------------
      - name: Clean up old archives
        run: |
          # 删除30天前的中文归档
          find archive/cn/ -name "bing-wallpaper-cn-*.md" -type f -mtime +30 -delete
          # 删除30天前的英文归档
          find archive/en/ -name "bing-wallpaper-en-*.md" -type f -mtime +30 -delete

      # -------------------------------------------------
      # 6️⃣ 提交并推送更改
      # -------------------------------------------------
      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --local user.email "kkkkkk@qq.com"
          git config --local user.name "GitHub Actions Bot"
          git add bing-wallpaper-*.md archive/
          # 如果没有变动则不报错，直接结束本步骤
          git commit -m "Auto-update: Latest wallpapers (CN+EN) + Archives" || echo "No changes to commit"
          git push https://${{ env.GH_TOKEN }}@github.com/jumoon2023/kkkkkkk.git
