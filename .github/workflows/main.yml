name: Download and Archive Wallpapers

on:
  schedule:
    - cron: '12 7 * * *'    # UTC 07:12 = 北京时间 15:12 ✓
    - cron: '12 16 * * *'   # UTC 16:12 = 北京时间 00:12 (次日) ✓
    - cron: '12 0 * * *'    # UTC 00:12 = 北京时间 08:12 ✓
  workflow_dispatch:     # 允许手动触发

jobs:
  download-and-archive:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write    # 授予写入权限
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true  # 保持推送凭证

    - name: Create archive directories
      run: |
        mkdir -p archive/cn
        mkdir -p archive/en

    - name: Download Chinese version
      run: |
        curl -s -o bing-wallpaper-cn.md https://raw.githubusercontent.com/niumoo/bing-wallpaper/refs/heads/main/zh-cn/bing-wallpaper.md
        TODAY=$(date +'%Y-%m-%d')
        cp bing-wallpaper-cn.md "archive/cn/bing-wallpaper-cn-$TODAY.md"

    - name: Download English version
      run: |
        curl -s -o bing-wallpaper-en.md https://raw.githubusercontent.com/niumoo/bing-wallpaper/refs/heads/main/bing-wallpaper.md
        TODAY=$(date +'%Y-%m-%d')
        cp bing-wallpaper-en.md "archive/en/bing-wallpaper-en-$TODAY.md"

    - name: Download free-proxy-list
      run: |
        curl -s -o free-proxy-list.csv https://raw.githubusercontent.com/proxifly/free-proxy-list/refs/heads/main/proxies/all/data.csv
        curl -s -o free-proxy-list.md https://raw.githubusercontent.com/proxifly/free-proxy-list/refs/heads/main/README.md
        TODAY=$(date +'%Y-%m-%d')
        cp free-proxy-list.csv "archive/en/free-proxy-list-$TODAY.csv"
        cp free-proxy-list.md "archive/en/free-proxy-list-$TODAY.md" || echo "README not found"

    - name: Clean up old archives
      run: |
        find archive/cn/ -name "bing-wallpaper-cn-*.md" -type f -mtime +30 -delete
        find archive/en/ -name "bing-wallpaper-en-*.md" -type f -mtime +30 -delete
        find archive/en/ -name "free-proxy-list-*.csv" -type f -mtime +30 -delete

    - name: Commit and push changes
      env:
        GH_TOKEN: ${{ secrets.PAT }}
      run: |
        git config --local user.email "ju.moon@qq.com"
        git config --local user.name "GitHub Actions Bot"
        git add bing-wallpaper-*.md archive/
        git commit -m "Auto-update: Latest wallpapers (CN+EN) + Archives" || echo "No changes to commit"
        git push https://${{ env.GH_TOKEN }}@github.com/jumoon2023/bing-wallpaper.git
